name: Reflex Android app

on:
  push:
    branches: ["**"]
    tags: ["reflex-v*"]
    paths:
      - "reaction-trainer/**"
      - ".github/workflows/reflex-android.yml"
  pull_request:
    paths:
      - "reaction-trainer/**"
      - ".github/workflows/reflex-android.yml"
  workflow_dispatch:

permissions:
  contents: write # needed to publish a Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reaction-trainer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit and Robolectric tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk reflex.apk

      - uses: actions/upload-artifact@v4
        with:
          name: reflex-apk
          path: reaction-trainer/reflex.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reflex-test-reports
          path: reaction-trainer/app/build/reports/tests

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/reflex-v')
        uses: softprops/action-gh-release@v2
        with:
          files: reaction-trainer/reflex.apk
