name: pkgfind release

on:
  push:
    branches: [main]
    tags: ["pkgfind-v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to publish a Release on tags

jobs:
  # Windows: bundle the Tkinter GUI into a standalone exe + Inno Setup installer.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pkgfind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip install pyinstaller sv-ttk

      - name: Build pkgfind.exe
        run: pyinstaller --noconfirm installer/pkgfind.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer\pkgfind.iss

      - uses: actions/upload-artifact@v4
        with:
          name: pkgfind-setup
          path: pkgfind/dist/pkgfind-setup.exe
          if-no-files-found: error

  # Linux: build the Flatpak single-file bundle from the existing manifest.
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build bundle
        working-directory: pkgfind/flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo=repo build dev.rolo.pkgfind.json
          flatpak build-bundle repo "$GITHUB_WORKSPACE/pkgfind.flatpak" dev.rolo.pkgfind

      - uses: actions/upload-artifact@v4
        with:
          name: pkgfind-flatpak
          path: pkgfind.flatpak
          if-no-files-found: error

  # On a version tag, gather both artifacts and publish one release.
  release:
    needs: [windows, flatpak]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: pkgfind ${{ github.ref_name }}
          files: |
            dist/**/pkgfind-setup.exe
            dist/**/pkgfind.flatpak
          body: |
            One search box over every package source on your system.

            ## Install

            ### Windows
            Download **`pkgfind-setup.exe`** below and run it — it installs to the
            Start menu and Add/Remove Programs. No Python required.

            ### Linux — Flatpak
            Download **`pkgfind.flatpak`** below, then:
            ```sh
            flatpak install ./pkgfind.flatpak
            ```

            ### macOS & Linux — Homebrew
            ```sh
            brew tap yarden2012/rolo https://github.com/yarden2012/rolo
            brew install yarden2012/rolo/pkgfind
            ```
