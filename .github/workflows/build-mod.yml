name: Build Mods

on:
  push:
    paths:
      - 'mc-mods/**'
      - '!mc-mods/*/dist/**'
      - '.github/workflows/build-mod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mod: mode-switcher
            java: 21
          - mod: hit-rhythm
            java: 25
          - mod: ledge-sense
            java: 25
          - mod: kit-watch
            java: 25
          - mod: fight-recap
            java: 25
          - mod: threat-pings
            java: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build mod
        working-directory: mc-mods/${{ matrix.mod }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Upload jar as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.mod }}
          path: mc-mods/${{ matrix.mod }}/build/libs/*.jar

  # Boots a real 26.1.2 client with the five PvP mods (under a virtual display) and plays
  # through a scripted fight; see mc-mods/pvp-smoke-test. Screenshots are uploaded either way.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the PvP mod jars
        run: |
          mkdir -p mc-mods/pvp-smoke-test/mods
          for mod in hit-rhythm ledge-sense kit-watch fight-recap threat-pings; do
            find "artifacts/$mod" -name '*.jar' ! -name '*-sources.jar' -exec cp {} mc-mods/pvp-smoke-test/mods/ \;
          done
          ls -l mc-mods/pvp-smoke-test/mods

      - name: Run client game test
        working-directory: mc-mods/pvp-smoke-test
        env:
          # The runner has no sound card. OpenAL's null device lets the sound engine start anyway,
          # which Threat Pings and Fight Recap's totem tracking need.
          ALSOFT_DRIVERS: "null"
        run: |
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
          chmod +x gradlew
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew --no-daemon runClientGameTest

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-screenshots
          path: mc-mods/pvp-smoke-test/build/run/clientGameTest/screenshots

  # Commits the built jars into each mod's dist/ folder, and the smoke test's screenshots into
  # mc-mods/pvp-smoke-test/screenshots. Runs for pushes to main, and for a manual run on any
  # branch. Jars from mods that failed to build are skipped.
  publish:
    needs: [build, smoke-test]
    if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Commit jars and screenshots
        run: |
          for dir in artifacts/*/; do
            mod=$(basename "$dir")
            [ -d "mc-mods/$mod" ] || continue
            mkdir -p "mc-mods/$mod/dist"
            for f in "$dir"*.jar; do
              case "$f" in
                *-sources.jar) ;;
                *) cp "$f" "mc-mods/$mod/dist/" ;;
              esac
            done
          done
          git add mc-mods/*/dist
          if compgen -G "artifacts/smoke-test-screenshots/*.png" > /dev/null; then
            rm -rf mc-mods/pvp-smoke-test/screenshots
            mkdir -p mc-mods/pvp-smoke-test/screenshots
            cp artifacts/smoke-test-screenshots/*.png mc-mods/pvp-smoke-test/screenshots/
            git add -A mc-mods/pvp-smoke-test/screenshots
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Add built mod jars [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
